[package]
name = "vetis-compio"
version = "0.1.1"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2021"
repository = "https://github.com/vetis-server/vetis-compio"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server with compio runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "compio", "rest-server"]
publish = true
rust-version = "1.75.0"

[package.metadata.docs.rs]
all-features = true

[package.metadata.wix]
upgrade-guid = "76DF79DF-E1F9-40A7-89D1-3190562C7851"
path-guid = "FEA82F70-7E57-447F-A361-76FB5E25BA5F"
license = false
eula = false

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
]

rust-tls = ["compio-tls/rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["rustls/aws-lc-rs"]
__rustls_ring = ["rustls/ring"]

http1 = [
  "hyper/http1",
  "hyper/server",
  "hyper-util/server",
  "hyper-util/http1",
  "hyper-body-utils/compio",
]
http2 = [
  "hyper/http2",
  "hyper/server",
  "hyper-util/server",
  "hyper-util/http2",
  "hyper-body-utils/compio",
]
http3 = [
  "compio-quic/h3",
  "compio-quic/ring",
  "hyper/server",
  "hyper-util/server",
  "hyper-body-utils/compio",
  "hyper-body-utils/compio-h3",
]

[dependencies]
async-lock = "3.4.1"
bytes = "1.12.1"
clap = { version = "4.6.6", default-features = false, features = [
  "std",
  "derive",
] }
compio-quic = { version = "0.8.2", default-features = false, optional = true }
compio-tls = { version = "0.10.0", default-features = false, optional = true }
cyper-core = "0.9.0"
env_logger = "0.11.9"
futures-util = { version = "0.3.32" }
http = "1.4.2"
http-body-util = { version = "0.1.3" }
hyper = { version = "1.10.1", default-features = false }
hyper-body-utils = { version = ">= 0.1.14", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
log = "0.4.34"
radix_trie = { version = "0.3.0", default-features = false }
rand = { version = "0.10.2", default-features = false }
rustls = { version = "0.23.40", default-features = false }
send_wrapper = { version = "0.6.0", default-features = false }
serde = "1.0.228"
serde_yaml_ng = "0.10.0"
socket2 = "0.6.4"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting"] }
typetag = "0.2.22"
url = "2.5.7"
vetis = { version = "0.1.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19.2", features = [
  "fs",
  "io",
  "net",
  "macros",
  "io-uring",
  "runtime",
  "signal",
  "tls",
], default-features = false }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
compio = { version = "0.19.2", features = [
  "fs",
  "io",
  "net",
  "macros",
  "polling",
  "runtime",
  "signal",
  "tls",
], default-features = false }

[dev-dependencies]
deboa = { version = "0.1.3" }
deboa-compio = { version = "0.1.1", features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
], default-features = false }
vetis-macros = { version = "0.1.1" }
